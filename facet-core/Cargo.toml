# Vendored facet-core 0.50.0-rc.5 (facet-rs/facet) with ONE change:
# chrono's display fns no longer truncate sub-second precision.
#
# Upstream formats `DateTime<*>` with `SecondsFormat::Secs` and the
# naive types with `%H:%M:%S`, both of which drop the fraction. chrono
# types are opaque scalars whose only encode path is `display`, so this
# is what EVERY facet format writes — facet-json, facet-toml, and vox.
# Every timestamp on every RPC arrived rounded to the second, and
# anything ordered by one could invert when two events shared a second.
#
# `SecondsFormat::AutoSi` and `%.f` both write nothing when the fraction
# is zero, so existing whole-second data formats byte-identically and
# only the lossy case changes. Parse sides take `%.f` too, so old files
# still read. See `tests/chrono_precision.rs`; drop this vendor once
# upstream carries the fix.
