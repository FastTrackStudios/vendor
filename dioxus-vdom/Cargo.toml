[package]
name = "dioxus-vdom"
version = "0.8.0-alpha.3"
authors = ["Jonathan Kelley"]
edition = "2024"
description = "Build fullstack web, desktop, and mobile apps with a single codebase."
license = "MIT OR Apache-2.0"
repository = "https://github.com/DioxusLabs/dioxus/"
homepage = "https://dioxuslabs.com"
keywords = ["web", "desktop", "mobile", "gui", "wasm"]
rust-version = "1.85.0"

[dependencies]
dioxus-const-vec = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
dioxus-vdom-macro = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
dioxus-vdom-template = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
dioxus-base-types = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
const_format = { version = "0.2.34" }
futures-channel = { version = "0.3.32" }
generational-box = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
longest-increasing-subsequence = { version = "0.1.0" }
rustc-hash = { version = "2.1.1" }
rustversion = { version = "1.0.21" }
slab = { version = "0.4.10" }
slotmap = { version = "1.0.7", features = ["serde"] }
tracing = { version = "0.1.44" }
futures-util = { version = "0.3.32", default-features = false, features = ["alloc", "std"] }
serde = { version = "1.0.228", features = ["derive"], optional = true }
subsecond = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
anyhow = { version = "1.0.102" }
xxhash-rust = { version = "0.8.15", default-features = false, features = ["const_xxh64"] }

[features]
serialize = ["dep:serde", "dioxus-vdom-template/serialize"]

[lints.rust]
# Allow `#[cfg(coverage_nightly)]` (upstream gates nightly-only coverage
# attributes on it) and `#[cfg(fuzzing)]`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)', 'cfg(fuzzing)'] }
