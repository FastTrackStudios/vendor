[package]
name = "dioxus-native-dom"
version = "0.8.0-alpha.3"
authors = ["Jonathan Kelley", "Nico Burns"]
edition = "2024"
description = "Core headless native renderer for Dioxus based on blitz"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DioxusLabs/dioxus/"
homepage = "https://dioxuslabs.com/learn/0.7/getting_started"
keywords = ["dom", "ui", "gui", "react"]

[dependencies]
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["custom-widget"] }
blitz-traits = { version = "=0.3.0-beta.4" }
dioxus-vdom = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
dioxus-html = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", default-features = false }
keyboard-types = { version = "0.8", default-features = false }
tracing = { version = "0.1.44", optional = true }
rustc-hash = { version = "2.1.1" }
futures-util = { version = "0.3.32", default-features = false }

[features]
default = ["accessibility", "svg", "system-fonts", "text-transform-icu"]
svg = ["blitz-dom/svg"]
floats = ["blitz-dom/floats"]
accessibility = ["blitz-dom/accessibility"]
tracing = ["dep:tracing", "blitz-dom/tracing"]
system-fonts = ["blitz-dom/system-fonts"]
complex-scripts = ["blitz-dom/complex-scripts"]
autofocus = ["blitz-dom/autofocus"]
text-transform-icu = ["blitz-dom/text-transform-icu"]
writing-mode = ["blitz-dom/writing-mode"]
