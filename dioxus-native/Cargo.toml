[package]
name = "dioxus-native"
version = "0.8.0-alpha.3"
authors = ["Jonathan Kelley", "Nico Burns"]
edition = "2024"
description = "Native renderer for Dioxus based on blitz"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DioxusLabs/dioxus/"
homepage = "https://dioxuslabs.com/learn/0.7/getting_started"
keywords = ["dom", "ui", "gui", "react"]

[dependencies]
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["custom-widget"] }
blitz-html = { version = "=0.3.0-beta.4", optional = true }
blitz-net = { version = "=0.3.0-beta.4", optional = true }
blitz-paint = { version = "=0.3.0-beta.4", features = ["custom-widget"], optional = true }
blitz-traits = { version = "=0.3.0-beta.4" }
blitz-shell = { version = "=0.3.0-beta.4", default-features = false }
anyrender = { version = "0.14.0" }
peniko = { version = "0.6.1", default-features = false }
anyrender_vello = { version = "0.15.0", optional = true }
anyrender_vello_hybrid = { version = "0.11.0", optional = true }
anyrender_vello_cpu = { version = "0.18.0", optional = true }
anyrender_skia = { version = "0.12.0", optional = true }
wgpu_context = { version = "0.10.0", optional = true }
dioxus-vdom = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
dioxus-html = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", default-features = false }
dioxus-native-dom = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
dioxus-asset-resolver = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", features = ["native"] }
dioxus-history = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", default-features = false }
dioxus-document = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", default-features = false }
dioxus-cli-config = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
dioxus-devtools = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", optional = true }
dioxus-hooks = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", optional = true }
dioxus-signals = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", optional = true }
dioxus-stores = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", optional = true }
dioxus-vdom-macro = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", optional = true }
manganis = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", features = ["dioxus"], optional = true }
winit = { version = "=0.31.0-beta.4" }
keyboard-types = { version = "0.8", default-features = false }
tokio = { version = "1.52.1", features = ["rt"], optional = true }
webbrowser = { version = "1.2.2" }
tracing = { version = "0.1.44", optional = true }
rustc-hash = { version = "2.1.1" }
futures-util = { version = "0.3.32", default-features = false }
cfg-if = "1.0.4"
slotmap = { version = "1.0.7", features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.52.1", features = ["rt-multi-thread"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", default-features = false }

[target.'cfg(all(target_os = "ios", target_abi = "sim"))'.dependencies]
anyrender_vello_cpu = { version = "0.18.0", features = ["pixels_window_renderer"] }

[features]
default = ["accessibility", "hot-reload", "net", "html", "svg", "system-fonts", "clipboard", "file-dialog", "vello-hybrid", "woff", "text-transform-icu", "apple-font-embolden"]
prelude = ["dep:dioxus-vdom-macro", "dep:dioxus-hooks", "dep:dioxus-signals", "dep:dioxus-stores", "dep:manganis"]
svg = ["blitz-dom/svg", "blitz-paint/svg"]
floats = ["blitz-dom/floats"]
autofocus = ["blitz-dom/autofocus"]
system-fonts = ["blitz-dom/system-fonts"]
complex-scripts = ["blitz-dom/complex-scripts"]
woff = ["blitz-dom/woff"]
text-transform-icu = ["blitz-dom/text-transform-icu"]
writing-mode = ["blitz-dom/writing-mode", "dioxus-native-dom/writing-mode"]
clipboard = []
file-dialog = ["blitz-shell/file-dialog"]
accessibility = ["blitz-shell/accessibility", "blitz-dom/accessibility"]
data-uri = ["blitz-shell/data-uri"]
vello = ["dep:anyrender_vello", "dep:wgpu_context"]
vello-hybrid = ["dep:anyrender_vello_hybrid", "dep:wgpu_context"]
skia = ["dep:anyrender_skia"]
skia-pixels = ["skia-raster-base", "anyrender_skia/pixels_window_renderer"]
skia-softbuffer = ["skia-raster-base", "anyrender_skia/softbuffer_window_renderer"]
skia-raster-base = ["dep:anyrender_skia"]
vello-cpu = ["vello-cpu-pixels"]
vello-cpu-pixels = ["vello-cpu-base", "anyrender_vello_cpu/pixels_window_renderer"]
vello-cpu-softbuffer = ["vello-cpu-base", "anyrender_vello_cpu/softbuffer_window_renderer"]
vello-cpu-base = ["dep:anyrender_vello_cpu"]
font-embolden = ["blitz-paint/font-embolden"]
apple-font-embolden = ["blitz-paint/apple-font-embolden"]
scrollbars = ["blitz-paint/scrollbars"]
net = ["dep:tokio", "dep:blitz-net"]
html = ["dep:blitz-html"]
hot-reload = ["dep:dioxus-devtools"]
log-times = ["log-phase-times", "log-frame-times"]
log-phase-times = ["blitz-dom/log-phase-times"]
log-frame-times = ["anyrender_vello_cpu?/log_frame_times", "anyrender_vello?/log_frame_times", "anyrender_vello_hybrid?/log_frame_times", "anyrender_skia?/log_frame_times"]
tracing = ["dep:tracing", "dioxus-native-dom/tracing", "blitz-shell/tracing", "blitz-dom/tracing", "blitz-html/tracing", "blitz-net/tracing"]
