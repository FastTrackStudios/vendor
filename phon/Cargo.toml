# Vendored phon 0.2.0-rc.7 (bearcove/phon) with ONE addition: derive
# support for parse/display opaque scalars (Uuid, chrono DateTime/NaiveDate,
# url, ulid, …) — upstream (rc.5 through rc.7) fails "cannot derive phon from
# this type" the first time such a field is encoded, and because the opaque
# encode thunk is `extern "C"` the panic aborts the process: task-server died
# on every issue/project list reply. Drop the vendor once upstream derives
# these (see src/derive.rs `display_scalar_descriptor`).
